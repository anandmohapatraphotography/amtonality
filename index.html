<style>
/* ============================================================
   TONALITY — editorial gallery-white system
   Paper, ink, hairlines. Type does the talking; images breathe.
   ============================================================ */
:root{
  --paper:#FBFAF7;
  --paper-2:#F2EFE9;
  --ink:#14130F;
  --ink-2:#6B675D;
  --ink-3:#9A958A;
  --rule:#E2DED5;
  --shadow:0 1px 0 rgba(20,19,15,.05);
  --ease:cubic-bezier(.19,.82,.24,1);
  --pad:clamp(20px,5vw,88px);
  --maxw:1680px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--paper);color:var(--ink)}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  font-weight:400;font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--ink);color:var(--paper)}

/* ---------- type ---------- */
.serif{font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-weight:400}
.display{
  font-family:"Instrument Serif",Georgia,serif;font-weight:400;
  font-size:clamp(2.9rem,8.4vw,8.2rem);line-height:.92;letter-spacing:-.022em;
}
.display em{font-style:italic;letter-spacing:-.01em}
.h2{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(2rem,4.6vw,4rem);line-height:1.02;letter-spacing:-.018em}
.h3{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(1.5rem,2.5vw,2.35rem);line-height:1.1;letter-spacing:-.014em}
.eyebrow{
  font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.185em;
  color:var(--ink-2);
}
.lede{font-size:clamp(1.02rem,1.35vw,1.2rem);line-height:1.68;color:var(--ink-2);max-width:46ch}
.body p{max-width:64ch;color:var(--ink-2);font-size:1.02rem;line-height:1.78}
.body p+p{margin-top:1.35em}
.num{font-size:11px;letter-spacing:.14em;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.rule{height:1px;background:var(--rule);width:100%}
section{position:relative}

/* ---------- header ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:60;
  background:rgba(251,250,247,.82);backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid transparent;
  transition:transform .5s var(--ease),border-color .4s ease,background .4s ease;
}
header.scrolled{border-bottom-color:var(--rule)}
header.hide{transform:translateY(-102%)}
.hbar{display:flex;align-items:center;justify-content:space-between;height:72px}
.mark{display:flex;align-items:center;gap:10px;line-height:1}
.mark img{height:34px;width:auto;display:block;transform:translateY(2px)}
.markfall{display:none;align-items:baseline;gap:10px}
.mark.fallback img{display:none}
.mark.fallback .markfall{display:flex}
.mark b{font-weight:500;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase}
.mark em{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:19px;color:var(--ink-2)}
.mark i{display:inline-block;width:16px;height:1px;background:var(--rule);transform:translateY(-5px)}
nav.main{display:flex;gap:34px;align-items:center}
nav.main a{
  font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);
  position:relative;padding:6px 0;transition:color .35s ease;
}
nav.main a::after{
  content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--ink);
  transform:scaleX(0);transform-origin:right;transition:transform .55s var(--ease);
}
nav.main a:hover{color:var(--ink)}
nav.main a:hover::after,nav.main a.active::after{transform:scaleX(1);transform-origin:left}
nav.main a.active{color:var(--ink)}
.burger{display:none;width:34px;height:34px;position:relative}
.burger s{position:absolute;left:6px;right:6px;height:1px;background:var(--ink);transition:transform .45s var(--ease),opacity .3s}
.burger s:nth-child(1){top:13px}.burger s:nth-child(2){top:20px}
body.menu .burger s:nth-child(1){transform:translateY(3.5px) rotate(45deg)}
body.menu .burger s:nth-child(2){transform:translateY(-3.5px) rotate(-45deg)}
.drawer{
  position:fixed;inset:72px 0 0;z-index:55;background:var(--paper);
  padding:0 var(--pad);display:flex;flex-direction:column;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .45s ease;
}
body.menu .drawer{opacity:1;pointer-events:auto}
.drawer a{font-family:"Instrument Serif",Georgia,serif;font-size:13vw;line-height:1.18;border-bottom:1px solid var(--rule);padding:.18em 0}

/* ---------- images ---------- */
.frame{position:relative;overflow:hidden;background:var(--paper-2)}
.frame img{width:100%;height:100%;object-fit:cover;
  transition:transform 1.6s var(--ease)}
.frame.r43{aspect-ratio:4/3}
.frame.r32{aspect-ratio:3/2}
.frame.r11{aspect-ratio:1/1}
.frame.r45{aspect-ratio:4/5}
.frame.r219{aspect-ratio:21/9}
/* natural-aspect frames — photographs are never cropped inside a series */
.frame.nat{aspect-ratio:auto;min-height:0;display:flex;align-items:center;justify-content:center;background:none}
.frame.nat.done{min-height:0}
.frame.nat img{position:relative;width:auto;max-width:100%;height:auto;max-height:78vh;object-fit:contain}
.frame.lead{aspect-ratio:auto;overflow:visible;background:none;display:flex;justify-content:center}
.frame.lead img{width:auto;max-width:100%;height:auto;max-height:68vh;object-fit:contain}
a.card:hover .frame img{transform:scale(1.045)}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(22px)}
.rv.in{opacity:1;transform:none;transition:opacity 1.15s var(--ease),transform 1.15s var(--ease)}
.rv.d1.in{transition-delay:.08s}.rv.d2.in{transition-delay:.16s}.rv.d3.in{transition-delay:.24s}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.frame img{transform:none}}

/* ---------- hero ---------- */
.hero{padding-top:clamp(104px,12vh,160px);padding-bottom:clamp(10px,1.4vw,24px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:clamp(28px,5vw,72px);align-items:center}
.hero-img{display:flex;align-items:center}
.hero-img .frame{width:100%}
.hero-img .frame{display:flex;justify-content:center;background:none}
.hero-img .frame img{height:auto;max-height:76vh;width:auto;max-width:100%;object-fit:contain}
.hero-copy{padding-bottom:clamp(0px,1.5vw,26px)}
.hero-copy .eyebrow{margin-bottom:clamp(18px,2.4vw,32px)}
.hero-copy .display{margin-bottom:clamp(20px,2.6vw,34px)}

/* ---------- link ---------- */
.arrow{display:inline-flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding-bottom:7px;border-bottom:1px solid var(--ink);transition:gap .45s var(--ease)}
.arrow:hover{gap:20px}
.arrow svg{width:15px;height:9px}


/* ---------- section head ---------- */
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:clamp(56px,8vw,120px) 0 clamp(24px,3.2vw,44px);flex-wrap:wrap}
.shead-first{padding-top:clamp(18px,2.2vw,34px);border-top:1px solid var(--rule);margin-top:clamp(10px,1.4vw,22px)}
.shead .h2{max-width:16ch}
.sectioncap{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(1.25rem,2.1vw,1.85rem);line-height:1.32;letter-spacing:-.008em;color:var(--ink);max-width:44ch;margin-top:14px}
.shead .eyebrow{margin-bottom:14px}

/* ---------- editorial work rows ---------- */
.works{display:grid;gap:clamp(40px,5.5vw,92px);padding-bottom:clamp(56px,8vw,120px)}
.work{display:grid;gap:clamp(16px,2vw,28px)}
.work.wide{grid-column:1/-1}
.work-row{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(16px,2.5vw,40px);align-items:end}
.c-1-8{grid-column:1/9}.c-9-12{grid-column:9/13}
.c-1-6{grid-column:1/7}.c-7-12{grid-column:7/13}
.c-1-5{grid-column:1/6}.c-6-12{grid-column:6/13}
.c-2-9{grid-column:2/10}.c-1-12{grid-column:1/13}
.c-4-12{grid-column:4/13}.c-1-7{grid-column:1/8}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:14px;border-top:1px solid var(--rule)}
.cap h3{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(1.25rem,2vw,1.9rem);line-height:1.12;letter-spacing:-.012em}
.cap .num{white-space:nowrap}
.card .cap h3{transition:opacity .4s ease}
.card:hover .cap h3{opacity:.55}
.blurb{font-size:14.5px;color:var(--ink-2);max-width:52ch;margin-top:10px;line-height:1.62}

/* ---------- index list view ---------- */
.toggle{display:flex;gap:2px;border:1px solid var(--rule);border-radius:999px;padding:3px}
.toggle button{font-size:11px;letter-spacing:.13em;text-transform:uppercase;padding:7px 16px;border-radius:999px;color:var(--ink-2);transition:.35s ease}
.toggle button.on{background:var(--ink);color:var(--paper)}
.list{border-top:1px solid var(--rule)}
.list a{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.2fr);gap:clamp(12px,2vw,32px);
  align-items:center;padding:clamp(18px,2.2vw,30px) 0;border-bottom:1px solid var(--rule);transition:padding .5s var(--ease)}
.list a:hover{padding-left:14px}
.list a h3{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(1.15rem,2.1vw,1.85rem);letter-spacing:-.012em}
.list a p{font-size:13.5px;color:var(--ink-2);line-height:1.5}
#thumb img{height:auto}
.list .thumb{position:absolute;pointer-events:none;width:300px;opacity:0;transform:translate(-50%,-50%) scale(.96);
  transition:opacity .45s ease,transform .6s var(--ease);z-index:5;overflow:hidden;background:var(--paper-2)}
.list .thumb.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- grid view ---------- */
/* Justified rows, matched to the grid on amtonality.com: each cell's width and
   flex-grow are both set to (aspect x BASE), so a row wraps naturally and then
   grows to fill the line — every image in it scaling by the same factor. Equal
   heights, flush margins, true aspect ratios, no cropping, no JS measuring. */
.jgal{display:flex;flex-wrap:wrap;margin-inline:calc(var(--inset) * -1)}
.jgal .gitem{box-sizing:border-box;padding:var(--inset);min-width:0;flex-shrink:1}
.jgal .gimg{display:block;width:100%;overflow:hidden;background:var(--paper-2)}
.jgal .gimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.4s var(--ease)}
.jgal a.gitem:hover .gimg img{transform:scale(1.035)}
.jgal.gallery{--inset:4px}
.jgal.gallery .gitem{display:flex;flex-direction:column}
.jgal.gallery .gimg{flex:1 1 auto;min-height:0}
/* Album covers are all 4:3, so they belong in an even column grid — every card
   the same width, rows lining up, and a partial last row keeping that width
   instead of shrinking to fit. Galleries above stay justified, because those
   photographs have mixed shapes. */
.jgal.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(18px,2.2vw,34px);margin-inline:0}
.jgal.cards .gitem{width:auto;padding:0;align-self:start}
@media (max-width:1180px){.jgal.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.jgal.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.jgal.cards{grid-template-columns:minmax(0,1fr)}}

/* ---------- about ---------- */
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,80px);align-items:start}
.factlist{list-style:none;border-top:1px solid var(--rule);margin-top:clamp(30px,4vw,52px)}
.factlist li{display:grid;grid-template-columns:130px 1fr;gap:20px;padding:14px 0;border-bottom:1px solid var(--rule);font-size:14px}
.factlist span{color:var(--ink-3);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding-top:4px}

/* ---------- project ---------- */
.phero{padding-top:clamp(104px,12vh,150px)}
.pmeta{display:flex;gap:clamp(24px,4vw,60px);flex-wrap:wrap;padding:clamp(22px,3vw,38px) 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:clamp(30px,4vw,54px)}
.pmeta div span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.pmeta div p{font-size:14.5px}
.pintro{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,80px);
  padding-top:clamp(38px,5vw,76px);align-items:start}
.pintro-lead{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(1.4rem,2.5vw,2.15rem);
  line-height:1.3;letter-spacing:-.008em;color:var(--ink);max-width:24ch}
.pintro:has(.body) .pintro-lead{max-width:22ch}
.pintro.solo{grid-template-columns:1fr}
.pintro.solo .pintro-lead{max-width:32ch;font-size:clamp(1.5rem,3vw,2.55rem)}
.pintro .body p{font-size:1rem;line-height:1.8}
.pnav{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,3vw,40px);padding:clamp(48px,7vw,110px) 0 clamp(40px,6vw,90px);border-top:1px solid var(--rule);margin-top:clamp(48px,7vw,110px)}
.pnav a{display:block}
.pnav .eyebrow{margin-bottom:10px}
.pnav .r{text-align:right}

/* ---------- contact ---------- */
.contact{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(30px,5vw,84px);align-items:start}
form{display:grid;gap:clamp(18px,2.4vw,30px)}
.field{position:relative;border-bottom:1px solid var(--rule);transition:border-color .4s ease}
.field:focus-within{border-color:var(--ink)}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.field input,.field textarea{width:100%;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--ink);padding:0 0 12px;resize:vertical}
.field textarea{min-height:120px}
.btn{display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);
  padding:16px 30px;border-radius:999px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  justify-self:start;transition:opacity .35s ease,gap .45s var(--ease)}
.btn:hover{opacity:.85;gap:22px}
.socials{list-style:none;border-top:1px solid var(--rule);margin-top:clamp(26px,3.4vw,44px)}
.socials a{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--rule);font-size:14px;transition:padding .5s var(--ease)}
.socials a:hover{padding-left:12px}
.socials a em{font-style:normal;color:var(--ink-3);font-size:12px;letter-spacing:.1em}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--rule);padding:clamp(40px,5vw,70px) 0 clamp(28px,3.4vw,44px);margin-top:clamp(50px,7vw,110px)}
.fgrid{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-end}
.fnav{display:flex;gap:26px;flex-wrap:wrap}
.fnav a,.fmeta{font-size:12px;letter-spacing:.1em;color:var(--ink-2);text-transform:uppercase}
.fbig{margin-bottom:clamp(28px,4vw,60px)}
.ftag{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(1.5rem,3.4vw,3rem);line-height:1.1;letter-spacing:-.018em;margin-top:clamp(16px,2vw,28px);color:var(--ink)}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;align-items:center;justify-content:center;
  padding:clamp(20px,5vw,70px);opacity:0;pointer-events:none;transition:opacity .5s ease}
.lb.on{opacity:1;pointer-events:auto}
.lb img{max-width:100%;max-height:82vh;object-fit:contain}
.lb .x{position:absolute;top:24px;right:var(--pad);font-size:12px;letter-spacing:.14em;text-transform:uppercase;z-index:2}
.lb .lbnav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;
  font-family:"Instrument Serif",Georgia,serif;font-size:34px;line-height:1;color:var(--ink);
  border:1px solid var(--rule);border-radius:999px;background:rgba(251,250,247,.9);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:opacity .35s ease,background .35s ease,border-color .35s ease,color .35s ease;opacity:.7;z-index:2}
.lb .lbnav:hover{opacity:1;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lb .lbnav.prev{left:var(--pad)}
.lb .lbnav.next{right:var(--pad)}
.lb .lbcount{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.14em;color:var(--ink-3);font-variant-numeric:tabular-nums}
@media (max-width:720px){
  /* On touch screens, swipe replaces buttons — hide the arrows entirely so they
     don't cover the photograph. Keyboard nav is irrelevant here. */
  .lb .lbnav{display:none}
  .lb .lbcount{bottom:18px}
}

/* ---------- page fade ---------- */
#view{animation:fade .7s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .hero-grid,.about,.contact,.pintro{grid-template-columns:1fr}
  .hero-img .frame{min-height:52vh}
  .pintro-lead,.pintro:has(.body) .pintro-lead{max-width:30ch}
  .hero-grid{gap:34px}
  .work-row{grid-template-columns:1fr}
  .c-1-8,.c-9-12,.c-1-5,.c-6-12,.c-2-9,.c-1-12,.c-4-12,.c-1-7,.c-1-6,.c-7-12{grid-column:1/-1}
  .list a{grid-template-columns:40px 1fr 70px}
  .list a p{display:none}
  .list .thumb{display:none}
}
@media (max-width:720px){
  nav.main{display:none}
  .burger{display:block}
  .hero{padding-top:110px}
  .pnav{grid-template-columns:1fr;gap:26px}
  .pnav .r{text-align:left}
}
</style>
</head>
<body>

<header id="hdr">
  <div class="wrap hbar">
    <a href="#/" class="mark" aria-label="Anand Mohapatra, Tonality — home">
      <img id="logoimg" src="https://cdn.myportfolio.com/9c0b9cff-4f88-4e53-a5c5-7ba8f446de1b/8c1ce994-695e-4cce-a523-a12cf994b4e5_rwc_0x0x6878x1425x4096.png?h=b28ae4cb18de0c41226a2907023f94f2" alt="Anand Mohapatra — Tonality">
      <span class="markfall"><b>Anand Mohapatra</b><i></i><em>Tonality</em></span>
    </a>
    <nav class="main" id="nav">
      <a href="#/architecture">Architecture</a>
      <a href="#/explorations">Explorations</a>
      <a href="#/about">About</a>
      <a href="#/contact">Contact</a>
    </nav>
    <button class="burger" id="burger" aria-label="Menu"><s></s><s></s></button>
  </div>
</header>

<div class="drawer" id="drawer">
  <a href="#/architecture">Architecture</a>
  <a href="#/explorations">Explorations</a>
  <a href="#/about">About</a>
  <a href="#/contact">Contact</a>
</div>

<main id="view"></main>

/* ============================================================
   RENDER
   ============================================================ */
const ARROW = '<svg viewBox="0 0 15 9" fill="none" aria-hidden="true"><path d="M0 4.5h13M9.5 1l3.5 3.5L9.5 8" stroke="currentColor" stroke-width="1"/></svg>';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

const frame = (src, ratio='nat', alt='') =>
  `<div class="frame ${ratio}"><img src="${src}" alt="${esc(alt)}" loading="lazy" decoding="async"></div>`;

/* Each item's width and flex-grow are (aspect x BASE); the inner box carries the
   aspect ratio, so its height follows automatically once the row is justified. */
const gitem = (src, ar, alt, href, cap, base) => {
  /* base is only used by the justified galleries; album cards sit in a fixed
     column grid, so they get no inline width and no flex-grow. */
  const sizing = base ? `style="width:${(ar*base).toFixed(2)}px;flex-grow:${(ar*base).toFixed(2)}" ` : '';
  return `
  <${href?'a':'div'} class="gitem" ${href?`href="${href}" `:''}${sizing}data-ar="${ar}">
    <span class="gimg" style="aspect-ratio:${ar}"><img src="${src}" alt="${esc(alt)}" loading="lazy" decoding="async"></span>
    ${cap||''}
  </${href?'a':'div'}>`;
};

/* Album cards use each series' own cover — the same cover image, and the same
   4:3 shape, that the collection pages on amtonality.com use. */
const card = (p, n, base) => gitem(
  p.cover,
  COVER_AR,
  p.title + ' — ' + SITE.name,
  `#/p/${p.slug}`,
  `<span class="cap"><h3>${esc(p.title)}</h3></span>`,
  base || null
);

/* BASE row heights. 260 is the value amtonality.com uses for its galleries. */

const CARD_BASE = 240;
const COVER_AR = 4/3;
const jgal = (html, cls) => `<div class="jgal ${cls}">${html}</div>`;

function project(p){
  const pool = ARCHITECTURE.includes(p) ? ARCHITECTURE : EXPLORATIONS;
  const i = pool.indexOf(p);

  const shots = p.images;
  const gal = shots.length
    ? `<div class="rv" style="padding-top:clamp(34px,4.5vw,72px)">
         ${jgal(shots.map((im,n)=>gitem(im.u, im.a, p.title+' — '+(n+1), null, '', GALLERY_BASE)).join(''), 'gallery')}
       </div>`
    : '';

  return `
  <section class="phero wrap">
    <div class="rv">
      <div class="eyebrow" style="margin-bottom:clamp(16px,2vw,26px)">${ARCHITECTURE.includes(p)?'Architecture':'Explorations'}</div>
      <h1 class="display" style="max-width:13ch">${esc(p.title)}</h1>
    </div>
    ${(() => {
      const parts = p.statement.split(/(?<=[.!?])\s+/);
      const lead  = parts[0];
      const rest  = parts.slice(1).join(' ');
      return `<div class="pintro rv${rest?'':' solo'}">
        <p class="pintro-lead">${esc(lead)}</p>
        ${rest ? `<div class="body"><p>${esc(rest)}</p></div>` : ''}
      </div>`;
    })()}
    ${gal}
    <div class="pnav">
      <a href="#/p/${prev.slug}"><div class="eyebrow">Previous</div><div class="h3">${esc(prev.title)}</div></a>
      <a href="#/p/${next.slug}" class="r"><div class="eyebrow">Next</div><div class="h3">${esc(next.title)}</div></a>
    </div>
  </section>`;
}

/* ============================================================
   ROUTER + BEHAVIOUR
   ============================================================ */
const view = document.getElementById('view');
const hdr  = document.getElementById('hdr');

function routeFor(hash){
  const h = (hash || '#/').replace(/^#/,'');
  if (h.startsWith('/p/')) {
    const p = bySlug(h.slice(3));
    return p ? { html: project(p), title: p.title, nav: ARCHITECTURE.includes(p)?'#/architecture':'#/explorations' }
             : { html: home(), title: null, nav: '#/' };
  }
  switch(h){
    case '/architecture': return { html: indexPage('Architecture and Interiors','Portfolio',
      'Shaped by years of observing spaces, structures, and the way light moves through them.', ARCHITECTURE), title:'Architecture', nav:'#/architecture' };
    case '/explorations': return { html: indexPage('Explorations','Portfolio',
      "Over the years, I\'ve explored different genres of photography, and this section showcases some of the work that fueled my creativity along the way — from travel, music, portraits, and food, some commissioned and some entirely personal.", EXPLORATIONS), title:'Explorations', nav:'#/explorations' };
    case '/about':   return { html: about(),   title:'About',   nav:'#/about' };
    case '/contact': return { html: contact(), title:'Contact', nav:'#/contact' };
    default:         return { html: home(),    title:null,      nav:'#/' };
  }
}

let io;
function observe(){
  if (io) io.disconnect();
  io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { rootMargin:'0px 0px -8% 0px', threshold:0.02 });
  view.querySelectorAll('.rv').forEach(el=>io.observe(el));
}

function lazyImages(){
  /* Images now carry a real src plus loading="lazy", so the browser handles
     fetching on its own. This only marks frames as settled for layout. */
  view.querySelectorAll('.frame img').forEach(img=>{
    const mark=()=>img.closest('.frame')?.classList.add('done');
    if (img.complete) mark(); else img.addEventListener('load', mark, {once:true});
  });
}

/* Flexbox justifies every row. The only case it gets wrong is a short final
   row, which would stretch one or two photos to an absurd size — so cap that
   row back to its natural base width and let it sit left-aligned. */
function guardLastRow(gal){
  const items = [...gal.children];
  if (items.length < 2) return;
  items.forEach(el => { el.style.flexGrow = el.style.width.replace('px',''); });
  const lastTop = items[items.length-1].offsetTop;
  const lastRow = items.filter(el => el.offsetTop === lastTop);
  if (lastRow.length === items.length) return;              // single row: leave it
  lastRow.forEach(el => { el.style.flexGrow = '0'; });
}

function layoutAll(){ view.querySelectorAll('.jgal.gallery').forEach(guardLastRow); }

let rt;
window.addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(layoutAll, 120); });

function wireIndexToggle(){
  const grid = document.getElementById('idx'), list = document.getElementById('idxlist');
  if (!grid) return;
  document.querySelectorAll('.toggle button').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.toggle button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      const isGrid = b.dataset.view === 'grid';
      grid.style.display = isGrid ? '' : 'none';
      list.style.display = isGrid ? 'none' : '';
      layoutAll(); if (!isGrid) lazyImages();
    });
  });
  // hover preview on the index list
  const thumb = document.getElementById('thumb'), timg = document.getElementById('thumbimg');
  list.querySelectorAll('a').forEach(a=>{
    a.addEventListener('mouseenter', ()=>{ timg.src = a.dataset.cover; timg.classList.add('loaded'); thumb.classList.add('show'); });
    a.addEventListener('mouseleave', ()=>thumb.classList.remove('show'));
  });
  list.addEventListener('mousemove', e=>{
    const r = list.getBoundingClientRect();
    thumb.style.left = (e.clientX - r.left) + 'px';
    thumb.style.top  = (e.clientY - r.top) + 'px';
  });
}

function wireForm(){
  const f = document.getElementById('cform');
  if (!f) return;
  const btn  = document.getElementById('csubmit');
  const note = document.getElementById('cnote');
  /* Google Apps Script web app — sends form contents to hello@amtonality.com */
  const endpoint = 'https://script.google.com/macros/s/AKfycbyBj-bylQ9oCRcA9PYHShK4byRdTJ94mJ4E6YRhOp40ojArk3c937pqz2Cx2koQYho/exec';

  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    if (!f.reportValidity()) return;
    if (f.querySelector('[name="_honey"]').value) return;         // spam bot filled the hidden field

    const btnLabel = btn.innerHTML;
    btn.disabled = true;
    btn.style.opacity = '.6';
    btn.innerHTML = 'Sending…';
    note.textContent = '';

    try {
      /* Apps Script doesn't set CORS headers, so use text/plain (no preflight) and
         no-cors mode. The response is opaque — an absence of network error means
         the POST reached the endpoint and the email was sent. */
      await fetch(endpoint, {
        method:'POST',
        mode:'no-cors',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.fromEntries(new FormData(f)))
      });
      f.innerHTML = `
        <div class="rv in" style="padding:clamp(28px,4vw,52px) 0">
          <div class="eyebrow" style="margin-bottom:14px">Received</div>
          <p class="pintro-lead" style="max-width:32ch">Thank you. Your message is on its way — a reply will follow within 48 hours.</p>
        </div>`;
    } catch (err) {
      btn.disabled = false;
      btn.style.opacity = '';
      btn.innerHTML = btnLabel;
      note.innerHTML = `Something went wrong — please write directly to <a href="mailto:${SITE.email}" style="text-decoration:underline">${SITE.email}</a>.`;
    }
  });
}

/* lightbox on project galleries */
const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg');
const lbprev = document.getElementById('lbprev'), lbnext = document.getElementById('lbnext');
const lbcount = document.getElementById('lbcount');
let lbList = [], lbIdx = 0;
const closeLb = ()=>{ lb.classList.remove('on'); document.body.style.overflow=''; };
const showLb = i => {
  if (!lbList.length) return;
  lbIdx = (i + lbList.length) % lbList.length;
  lbimg.src = lbList[lbIdx];
  lbcount.textContent = String(lbIdx+1).padStart(2,'0') + ' / ' + String(lbList.length).padStart(2,'0');
};
document.getElementById('lbx').addEventListener('click', closeLb);
lbprev.addEventListener('click', e=>{ e.stopPropagation(); showLb(lbIdx-1); });
lbnext.addEventListener('click', e=>{ e.stopPropagation(); showLb(lbIdx+1); });
/* click the paper background to close; clicks on the image or nav do not */
lb.addEventListener('click', e=>{ if(e.target===lb) closeLb(); });
document.addEventListener('keydown', e=>{
  if (e.key === 'Escape') { closeLb(); document.body.classList.remove('menu'); return; }
  if (!lb.classList.contains('on')) return;
  if (e.key === 'ArrowRight') showLb(lbIdx + 1);
  else if (e.key === 'ArrowLeft') showLb(lbIdx - 1);
});
/* Swipe navigation on touch devices. Horizontal swipe > 50px flips, vertical
   swipe > 80px closes. A dominant vertical motion is treated as scroll and
   ignored, so pinch-zoom and tap-and-hold aren't hijacked. */
let tx = 0, ty = 0, tt = 0;
lb.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now();
}, { passive: true });
lb.addEventListener('touchend', e => {
  if (!lb.classList.contains('on') || e.changedTouches.length !== 1) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  const dt = Date.now() - tt;
  if (dt > 700) return;                       // too slow → probably a scroll
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    showLb(lbIdx + (dx < 0 ? 1 : -1));         // swipe left = next, right = prev
  } else if (dy < -80 && Math.abs(dy) > Math.abs(dx)) {
    closeLb();                                  // swipe up = close
  }
}, { passive: true });
function wireLightbox(){
  const imgs = [...view.querySelectorAll('.jgal.gallery .gimg img')];
  const srcs = imgs.map(im => im.dataset.src || im.src);
  imgs.forEach((img, i)=>{
    img.style.cursor='zoom-in';
    img.addEventListener('click', ()=>{
      lbList = srcs;
      showLb(i);
      lb.classList.add('on'); document.body.style.overflow='hidden';
    });
  });
}

function render(){
  const r = routeFor(location.hash);
  view.innerHTML = r.html;
  document.title = (r.title ? r.title + ' — ' : '') + 'Anand Mohapatra — Tonality | Architecture Photography, Vancouver';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active', a.getAttribute('href')===r.nav));
  document.body.classList.remove('menu');
  layoutAll(); observe(); lazyImages(); wireIndexToggle(); wireForm(); wireLightbox();
  window.scrollTo({ top:0, behavior:'instant' in window ? 'instant' : 'auto' });
}

window.addEventListener('hashchange', render);
document.getElementById('burger').addEventListener('click', ()=>document.body.classList.toggle('menu'));
document.getElementById('drawer').addEventListener('click', e=>{ if(e.target.tagName==='A') document.body.classList.remove('menu'); });
document.getElementById('yr').textContent = new Date().getFullYear();
/* if the logo file fails to load, fall back to the typographic wordmark */
(function(){
  const li = document.getElementById('logoimg');
  li.addEventListener('error', ()=>li.closest('.mark').classList.add('fallback'));
  if (li.complete && li.naturalWidth === 0) li.closest('.mark').classList.add('fallback');
})();

let last = 0;
window.addEventListener('scroll', ()=>{
  const y = window.scrollY;
  hdr.classList.toggle('scrolled', y > 12);
  hdr.classList.toggle('hide', y > 320 && y > last && !document.body.classList.contains('menu'));
  last = y;
}, { passive:true });

render();
